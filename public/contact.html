<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Saif Quazi | Contact</title>

        <meta
            name="description"
            content="Get in touch with Saif Quazi. Contact me for software development opportunities, collaborations, or any inquiries."
        />
        <meta
            name="robots"
            content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
        />
        <link rel="canonical" href="https://saifq.co/" />
        <link rel="icon" href="assets/sq-logo.png" type="image/png" />

        <!-- Additional SEO -->
        <meta name="author" content="Saif Quazi" />
        <meta
            name="keywords"
            content="contact Saif Quazi, get in touch, software developer contact, hire developer, collaboration, inquiries, email Saif Quazi"
        />
        <meta name="language" content="en" />
        <meta name="rating" content="general" />
        <meta name="revisit-after" content="7 days" />

        <!-- Social / Open Graph -->
        <meta property="og:title" content="Contact Saif Quazi | Get In Touch" />
        <meta
            property="og:description"
            content="Get in touch with Saif Quazi. Contact me for software development opportunities, collaborations, or any inquiries."
        />
        <meta
            property="og:image"
            content="https://saifq.co/assets/sq-logo.png"
        />
        <meta property="og:url" content="https://saifq.co/contact.html" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Saif Quazi Contact" />

        <!-- Twitter Cards -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Contact Saif Quazi | Get In Touch"
        />
        <meta
            name="twitter:description"
            content="Get in touch with Saif Quazi. Contact me for software development opportunities, collaborations, or any inquiries."
        />
        <meta
            name="twitter:image"
            content="https://saifq.co/assets/sq-logo.png"
        />
        <meta name="twitter:site" content="@YourTwitterHandle" />

        <!-- Fonts and Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <script
            src="https://kit.fontawesome.com/5eea32f2cd.js"
            crossorigin="anonymous"
            defer
        ></script>

        <!-- CSS -->
        <link rel="stylesheet" href="styles/main.css" />
        <link rel="stylesheet" href="styles/page/contact.css" />
        <link rel="stylesheet" href="styles/responsive.css" />
    </head>
    <body>
        <canvas id="particles"></canvas>
        <screensize-warning></screensize-warning>
        <nav-menu></nav-menu>
        <menu-btn></menu-btn>
        <main>
            <form
                id="contactForm"
                name="contact"
                method="POST"
                data-netlify="true"
                netlify-honeypot="bot-field"
            >
                <input type="hidden" name="form-name" value="contact" />

                <!-- Hidden honeypot field for spam protection -->
                <p style="display: none">
                    <label
                        >Don't fill this out if you're human:
                        <input name="bot-field"
                    /></label>
                </p>
                <h1 id="formTitle">Get in touch with me</h1>
                <p id="formSubtitle">Projects, collab, and opportunities</p>
                <input
                    type="text"
                    class="formFields"
                    id="formName"
                    name="name"
                    placeholder="Your Name"
                    required
                    maxlength="100"
                />
                <input
                    type="email"
                    class="formFields"
                    id="formEmail"
                    name="email"
                    placeholder="Your Email"
                    required
                    maxlength="100"
                />
                <textarea
                    class="formFields"
                    id="formMessage"
                    name="message"
                    placeholder="What would you like to discuss?"
                    required
                    maxlength="500"
                ></textarea>
                <button id="submitBtn" type="submit">Submit</button>
            </form>
        </main>
        <script src="client/components.js"></script>
        <script src="client/main.js"></script>
        <script src="client/particles.js"></script>
    </body>
</html>
